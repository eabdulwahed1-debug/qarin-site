<h1>ابحث في قارن</h1>
<input class="search-box" id="q" type="search" placeholder="مثال: قلاية، مكنسة، ضغط…" aria-label="ابحث">
<div id="results">[[guides:all]]</div>
<p id="none" class="muted" hidden>لا توجد نتائج. جرّب كلمة أخرى.</p>
<script>
(function () {
  var q = document.getElementById('q');
  var cards = Array.prototype.slice.call(document.querySelectorAll('#results .card'));
  var none = document.getElementById('none');
  function norm(s) { return (s || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي'); }
  function run() {
    var v = norm(q.value.trim()); var shown = 0;
    cards.forEach(function (c) {
      var hit = !v || norm(c.getAttribute('data-search')).indexOf(v) !== -1;
      c.hidden = !hit; if (hit) shown++;
    });
    none.hidden = shown !== 0;
  }
  q.addEventListener('input', run);
  var p = new URLSearchParams(location.search).get('q');
  if (p) { q.value = p; run(); }
})();
</script>
